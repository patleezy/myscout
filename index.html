<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyScout</title>

  <!-- Open Graph / Social -->
  <meta name="description" content="Save anything interesting. Ask questions about it later." />
  <meta property="og:title"       content="MyScout" />
  <meta property="og:description" content="Save anything interesting. Ask questions about it later." />
  <meta property="og:image"       content="https://myscout-seven.vercel.app/og.svg" />
  <meta property="og:url"         content="https://myscout-seven.vercel.app" />
  <meta property="og:type"        content="website" />
  <meta name="twitter:card"       content="summary_large_image" />
  <meta name="twitter:title"      content="MyScout" />
  <meta name="twitter:description" content="Save anything interesting. Ask questions about it later." />
  <meta name="twitter:image"      content="https://myscout-seven.vercel.app/og.svg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080808;
      --surface: #111111;
      --border:  rgba(255, 255, 255, 0.07);
      --text:    #e8e8e8;
      --muted:   #505050;
      --muted-2: #888888;
      --accent:  #f59e0b;
      --radius:  13px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Auth screen ──────────────────────────────────────────── */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Gradient blobs */
    #auth-screen::before,
    #auth-screen::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    #auth-screen::before {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.13) 0%, transparent 70%);
      top: -120px;
      right: -80px;
    }

    #auth-screen::after {
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, rgba(109, 40, 217, 0.1) 0%, transparent 70%);
      bottom: -140px;
      left: -100px;
    }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 22px;
      padding: 44px 40px 38px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02),
        0 32px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .auth-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #0a0a0a;
      flex-shrink: 0;
    }

    .auth-brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .auth-heading {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--muted-2);
      margin-bottom: 28px;
    }

    .auth-field { margin-bottom: 14px; }

    .auth-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-2);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .auth-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .auth-input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .auth-input::placeholder { color: var(--muted); }

    .auth-btn {
      width: 100%;
      margin-top: 8px;
      background: linear-gradient(150deg, #f59e0b 0%, #d97706 100%);
      color: #0a0a0a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      letter-spacing: -0.1px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
      transition: opacity 0.15s, box-shadow 0.15s;
    }

    .auth-btn:hover:not(:disabled) {
      opacity: 0.9;
      box-shadow: 0 4px 28px rgba(245, 158, 11, 0.3);
    }

    .auth-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .auth-toggle {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted-2);
    }

    .auth-toggle-link {
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: inherit;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      margin-left: 4px;
    }

    .auth-toggle-link:hover { text-decoration: underline; }

    .auth-msg {
      border-radius: 8px;
      font-size: 13px;
      padding: 10px 13px;
      margin-top: 14px;
      display: none;
    }

    .auth-msg.error {
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }

    .auth-msg.success {
      background: rgba(74, 222, 128, 0.06);
      border: 1px solid rgba(74, 222, 128, 0.16);
      color: #86efac;
    }

    /* ── App screen ───────────────────────────────────────────── */
    #app-screen { display: none; }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 20px;
      border-bottom: 1px solid var(--border);
    }

    .app-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .app-mark {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #0a0a0a;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-email {
      font-size: 12px;
      color: var(--muted);
      display: none;
    }

    @media (min-width: 480px) { .user-email { display: block; } }

    .btn-signout {
      background: none;
      border: none;
      color: var(--muted-2);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }

    .btn-signout:hover { color: var(--text); }

    /* ── Compose ──────────────────────────────────────────────── */
    .compose {
      padding: 26px 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .compose-textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.65;
      padding: 16px 18px;
      resize: none;
      min-height: 108px;
      outline: none;
      display: block;
      transition: border-color 0.15s;
    }

    .compose-textarea:focus { border-color: rgba(245, 158, 11, 0.3); }
    .compose-textarea::placeholder { color: var(--muted); }

    .compose-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .char-count { font-size: 12px; color: var(--muted); }

    .btn-save {
      background: var(--accent);
      color: #0a0a0a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: -0.1px;
      transition: opacity 0.15s;
    }

    .btn-save:hover:not(:disabled) { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Notes ────────────────────────────────────────────────── */
    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 14px;
    }

    .notes-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .notes-count { font-size: 12px; color: var(--muted); }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 80px;
    }

    /* Note card */
    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      transition: border-color 0.15s;
    }

    .note-card:hover { border-color: rgba(255, 255, 255, 0.12); }

    .note-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .note-date { font-size: 12px; color: var(--muted); }

    .btn-summarize {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }

    .btn-summarize:hover:not(:disabled) { color: var(--accent); }
    .btn-summarize:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-delete {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 0 3px 10px;
      transition: color 0.15s;
      line-height: 1;
    }

    .btn-delete:hover { color: #ef4444; }

    /* OG image preview */
    .note-og {
      margin: -20px -22px 16px;
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
      aspect-ratio: 2 / 1;
      background: var(--bg);
    }

    .note-og img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .note-og-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-2);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Inline AI summary */
    .note-summary {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(245, 158, 11, 0.1);
    }

    .summary-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.75;
    }

    .summary-text {
      font-size: 14px;
      color: var(--muted-2);
      line-height: 1.65;
    }

    /* ── Utility ──────────────────────────────────────────────── */
    .hidden { display: none !important; }

    .empty-state {
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
    }

    .empty-icon { font-size: 30px; margin-bottom: 10px; }
    .empty-text { font-size: 14px; line-height: 1.7; }

    .loading-state {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.07);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Search ───────────────────────────────────────────────── */
    .search-wrap { padding: 20px 0 0; }

    .search-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 11px 36px 11px 40px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: rgba(245, 158, 11, 0.3); }
    .search-input::placeholder { color: var(--muted); }
    .search-input::-webkit-search-cancel-button { display: none; }

    .btn-search-clear {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .btn-search-clear:hover { color: var(--text); }

    /* ── Tags ─────────────────────────────────────────────────── */
    .note-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .tag-pill {
      background: none;
      border: 1px solid rgba(245, 158, 11, 0.18);
      border-radius: 20px;
      color: var(--muted-2);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 9px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .tag-pill:hover { border-color: var(--accent); color: var(--accent); }

    .tag-pill.loading {
      border-color: rgba(255,255,255,0.06);
      color: var(--muted);
      cursor: default;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.9; } }

    .tag-filter-chip {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      color: var(--accent);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .tag-filter-chip:hover { opacity: 0.75; }

    @media (max-width: 440px) {
      .auth-card { padding: 36px 24px 32px; }
    }
  </style>
</head>
<body>

<!-- ── Auth screen ──────────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-mark">M</div>
      <span class="auth-brand-name">MyScout</span>
    </div>

    <h1 class="auth-heading" id="auth-heading">Welcome back.</h1>
    <p  class="auth-sub"     id="auth-sub">Sign in to your account to continue.</p>

    <div class="auth-field">
      <label class="auth-label" for="email">Email address</label>
      <input class="auth-input" type="email" id="email"
             placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password"
             placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="auth-btn" id="auth-btn">Sign in</button>

    <div class="auth-msg error"   id="auth-error"></div>
    <div class="auth-msg success" id="auth-success"></div>

    <p class="auth-toggle">
      <span id="toggle-label">Don't have an account?</span>
      <button class="auth-toggle-link" id="toggle-btn" onclick="toggleAuthMode()">Sign up</button>
    </p>

  </div>
</div>

<!-- ── App screen ───────────────────────────────────────────────── -->
<div id="app-screen">
  <div class="container">

    <header class="app-header">
      <div class="app-logo">
        <div class="app-mark">M</div>
        MyScout
      </div>
      <div class="header-right">
        <span class="user-email" id="user-email"></span>
        <button class="btn-signout" id="btn-logout">Sign out</button>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-field">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="search-input" type="search" id="search-input"
               placeholder="Search your notes…" autocomplete="off" />
        <button class="btn-search-clear hidden" id="search-clear" onclick="clearSearch()">✕</button>
      </div>
    </div>

    <section class="compose">
      <textarea
        class="compose-textarea"
        id="note-input"
        placeholder="Save something interesting…"
        maxlength="10000"
      ></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 10,000</span>
        <button class="btn-save" id="btn-save">Save</button>
      </div>
    </section>

    <div class="notes-header">
      <span class="notes-label" id="notes-label">Saved</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="notes-count" id="notes-count"></span>
        <button class="tag-filter-chip hidden" id="tag-filter-chip" onclick="clearTagFilter()">
          <span id="tag-filter-text"></span> ✕
        </button>
      </div>
    </div>

    <div class="notes-list" id="notes-list">
      <div class="loading-state"><span class="spinner"></span> Loading…</div>
    </div>

  </div>
</div>

<!-- Supabase JS (UMD) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  // ── Config ────────────────────────────────────────────────────────────────────
  // Supabase project URL and anon key — both are public values, safe for frontend.
  const SUPABASE_URL  = 'https://krkuqtmttobswcnvjaqw.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_ZmLxtuwdlC0i03Hvu9Hh1Q_G-h4aq3i';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const authScreen  = document.getElementById('auth-screen');
  const appScreen   = document.getElementById('app-screen');
  const emailInput  = document.getElementById('email');
  const passInput   = document.getElementById('password');
  const authBtn     = document.getElementById('auth-btn');
  const authError   = document.getElementById('auth-error');
  const authSuccess = document.getElementById('auth-success');
  const authHeading = document.getElementById('auth-heading');
  const authSub     = document.getElementById('auth-sub');
  const toggleLabel = document.getElementById('toggle-label');
  const toggleBtn   = document.getElementById('toggle-btn');
  const userEmailEl = document.getElementById('user-email');
  const btnLogout   = document.getElementById('btn-logout');
  const noteInput   = document.getElementById('note-input');
  const charCount   = document.getElementById('char-count');
  const btnSave     = document.getElementById('btn-save');
  const notesList      = document.getElementById('notes-list');
  const notesCount     = document.getElementById('notes-count');
  const notesLabel     = document.getElementById('notes-label');
  const searchInput    = document.getElementById('search-input');
  const searchClear    = document.getElementById('search-clear');
  const tagFilterChip  = document.getElementById('tag-filter-chip');
  const tagFilterText  = document.getElementById('tag-filter-text');

  // ── App state ─────────────────────────────────────────────────────────────────
  let allNotes       = [];
  let activeTag      = null;
  let recentlySavedId = null;
  let searchTimer    = null;

  // ── Auth mode toggle ──────────────────────────────────────────────────────────
  let authMode = 'login';

  function toggleAuthMode() {
    authMode = authMode === 'login' ? 'signup' : 'login';
    clearAuthMsgs();
    if (authMode === 'signup') {
      authHeading.textContent = 'Create account.';
      authSub.textContent     = 'Join MyScout to start saving.';
      authBtn.textContent     = 'Create account';
      toggleLabel.textContent = 'Already have an account?';
      toggleBtn.textContent   = 'Sign in';
      passInput.setAttribute('autocomplete', 'new-password');
    } else {
      authHeading.textContent = 'Welcome back.';
      authSub.textContent     = 'Sign in to your account to continue.';
      authBtn.textContent     = 'Sign in';
      toggleLabel.textContent = "Don't have an account?";
      toggleBtn.textContent   = 'Sign up';
      passInput.setAttribute('autocomplete', 'current-password');
    }
  }

  // ── UI helpers ────────────────────────────────────────────────────────────────
  function showAuth() {
    authScreen.style.display = 'flex';
    appScreen.style.display  = 'none';
  }

  function showApp(session) {
    authScreen.style.display = 'none';
    appScreen.style.display  = 'block';
    if (session?.user?.email) userEmailEl.textContent = session.user.email;
    loadNotes();
  }

  function setAuthError(msg) {
    authError.textContent     = msg;
    authError.style.display   = msg ? 'block' : 'none';
    authSuccess.style.display = 'none';
  }

  function setAuthSuccess(msg) {
    authSuccess.textContent  = msg;
    authSuccess.style.display = msg ? 'block' : 'none';
    authError.style.display   = 'none';
  }

  function clearAuthMsgs() {
    authError.style.display = authSuccess.style.display = 'none';
  }

  function setAuthBusy(busy) {
    authBtn.disabled = emailInput.disabled = passInput.disabled = busy;
    authBtn.textContent = busy
      ? (authMode === 'login' ? 'Signing in…' : 'Creating account…')
      : (authMode === 'login' ? 'Sign in'     : 'Create account');
  }

  function setSaveBusy(busy) {
    btnSave.disabled = noteInput.disabled = busy;
    btnSave.textContent = busy ? 'Saving…' : 'Save';
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/"/g,  '&quot;');
  }

  function renderNotes(notes, { searchMode = false } = {}) {
    notesCount.textContent = notes.length
      ? `${notes.length} ${notes.length === 1 ? 'note' : 'notes'}`
      : '';

    if (!notes.length) {
      notesList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${searchMode ? '🔍' : '📓'}</div>
          <div class="empty-text">${searchMode ? 'No matching notes found.' : 'Nothing saved yet.<br>Write your first note above.'}</div>
        </div>`;
      return;
    }

    notesList.innerHTML = notes.map(n => {
      const hasTags    = Array.isArray(n.tags) && n.tags.length > 0;
      const isTagging  = n.id === recentlySavedId && !hasTags;
      const tagsHtml   = isTagging
        ? `<span class="tag-pill loading">✦ tagging…</span>`
        : (hasTags ? n.tags.map(t =>
            `<button class="tag-pill" onclick="filterByTag('${escapeHtml(t)}')">${escapeHtml(t)}</button>`
          ).join('') : '');

      const ogHtml = n.og_image ? `
        <div class="note-og">
          <img src="${escapeHtml(n.og_image)}" alt="" loading="lazy" onerror="this.closest('.note-og').remove()" />
        </div>
        ${n.og_title ? `<div class="note-og-title">${escapeHtml(n.og_title)}</div>` : ''}` : '';

      return `
      <article class="note-card" data-id="${n.id}">
        ${ogHtml}
        <div class="note-content">${escapeHtml(n.content)}</div>
        ${tagsHtml ? `<div class="note-tags">${tagsHtml}</div>` : ''}
        <div class="note-footer">
          <span class="note-date">${formatDate(n.created_at)}</span>
          <div style="display:flex;align-items:center">
            <button class="btn-summarize" onclick="summarizeNote('${n.id}', this)">✦ Summarize</button>
            <button class="btn-delete" onclick="deleteNote('${n.id}', this)" title="Delete">✕</button>
          </div>
        </div>
        <div class="note-summary hidden" id="summary-${n.id}"></div>
      </article>`;
    }).join('');
  }

  // ── Auth ──────────────────────────────────────────────────────────────────────
  async function handleAuth() {
    const email = emailInput.value.trim();
    const pass  = passInput.value;
    if (!email || !pass) { setAuthError('Email and password are required.'); return; }
    if (authMode === 'signup' && pass.length < 6) {
      setAuthError('Password must be at least 6 characters.');
      return;
    }

    setAuthBusy(true);
    clearAuthMsgs();

    if (authMode === 'login') {
      const { error } = await db.auth.signInWithPassword({ email, password: pass });
      setAuthBusy(false);
      if (error) setAuthError(error.message);
    } else {
      const { error } = await db.auth.signUp({ email, password: pass });
      setAuthBusy(false);
      if (error) {
        setAuthError(error.message);
      } else {
        const { data } = await db.auth.getSession();
        if (!data.session) setAuthSuccess('Check your email to confirm your account.');
      }
    }
  }

  // ── Notes ─────────────────────────────────────────────────────────────────────
  async function loadNotes() {
    notesList.innerHTML = '<div class="loading-state"><span class="spinner"></span> Loading…</div>';

    const { data, error } = await db
      .from('notes')
      .select('id, content, tags, og_image, og_title, created_at')
      .order('created_at', { ascending: false });

    if (error) {
      notesList.innerHTML = '<div class="empty-state"><div class="empty-text" style="color:var(--muted)">Failed to load notes.</div></div>';
      return;
    }
    allNotes = data;
    notesLabel.textContent = 'Saved';
    tagFilterChip.classList.add('hidden');
    renderNotes(activeTag ? allNotes.filter(n => n.tags?.includes(activeTag)) : allNotes);
  }

  async function saveNote() {
    const content = noteInput.value.trim();
    if (!content) return;

    setSaveBusy(true);
    const { data: { session } } = await db.auth.getSession();

    const { data: inserted, error } = await db
      .from('notes')
      .insert({ user_id: session.user.id, content })
      .select('id')
      .single();

    setSaveBusy(false);
    if (error) { alert('Failed to save note. Please try again.'); return; }

    noteInput.value       = '';
    charCount.textContent = '0 / 10,000';
    recentlySavedId       = inserted.id;
    clearSearch();
    activeTag = null;
    await loadNotes();

    // Generate embedding + tags in the background; reload when done
    embedNote(inserted.id, content, session.access_token).then(() => {
      recentlySavedId = null;
      loadNotes();
    });
  }

  // ── Summarize ─────────────────────────────────────────────────────────────────
  async function summarizeNote(noteId, btn) {
    const card      = btn.closest('.note-card');
    const content   = card.querySelector('.note-content').textContent;
    const summaryEl = document.getElementById(`summary-${noteId}`);

    btn.disabled    = true;
    btn.textContent = '✦ Thinking…';

    const { data: { session } } = await db.auth.getSession();

    let res;
    try {
      res = await fetch('/api/summarize', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ content })
      });
    } catch {
      btn.disabled    = false;
      btn.textContent = '✦ Summarize';
      alert('Network error. Please try again.');
      return;
    }

    const data = await res.json();

    if (!res.ok) {
      btn.disabled    = false;
      btn.textContent = '✦ Summarize';
      alert(data.error || 'Failed to summarize.');
      return;
    }

    summaryEl.innerHTML = `
      <div class="summary-label">AI Summary</div>
      <div class="summary-text">${escapeHtml(data.summary)}</div>
    `;
    summaryEl.classList.remove('hidden');
    btn.style.display = 'none';
  }

  // ── Embed (background) ───────────────────────────────────────────────────────
  async function embedNote(noteId, content, token) {
    try {
      await fetch('/api/embed', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ noteId, content })
      });
    } catch { /* silent fail — tags just won't appear */ }
  }

  // ── Delete ───────────────────────────────────────────────────────────────────
  async function deleteNote(noteId, btn) {
    btn.disabled = true;
    const { error } = await db.from('notes').delete().eq('id', noteId);
    if (error) { btn.disabled = false; alert('Failed to delete. Try again.'); return; }
    allNotes = allNotes.filter(n => n.id !== noteId);
    if (activeTag) {
      renderNotes(allNotes.filter(n => n.tags?.includes(activeTag)));
    } else if (searchInput.value.trim()) {
      btn.closest('.note-card').remove();
    } else {
      renderNotes(allNotes);
    }
    notesCount.textContent = allNotes.length
      ? `${allNotes.length} ${allNotes.length === 1 ? 'note' : 'notes'}` : '';
  }

  // ── Search ────────────────────────────────────────────────────────────────────
  async function searchNotes(query) {
    if (!query.trim()) { clearSearch(); return; }

    activeTag = null;
    tagFilterChip.classList.add('hidden');
    notesLabel.textContent = `Results for "${query}"`;
    notesList.innerHTML    = '<div class="loading-state"><span class="spinner"></span> Searching…</div>';

    const { data: { session } } = await db.auth.getSession();

    let res;
    try {
      res = await fetch('/api/search', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ query })
      });
    } catch {
      notesList.innerHTML = '<div class="empty-state"><div class="empty-text" style="color:var(--muted)">Search failed. Try again.</div></div>';
      return;
    }

    const data = await res.json();
    if (!res.ok) {
      notesList.innerHTML = `<div class="empty-state"><div class="empty-text" style="color:var(--muted)">${data.error || 'Search failed.'}</div></div>`;
      return;
    }

    notesCount.textContent = data.results.length
      ? `${data.results.length} ${data.results.length === 1 ? 'result' : 'results'}`
      : '';
    renderNotes(data.results, { searchMode: true });
  }

  function clearSearch() {
    searchInput.value = '';
    searchClear.classList.add('hidden');
    notesLabel.textContent = activeTag ? `Tag: ${activeTag}` : 'Saved';
    if (!activeTag) {
      notesCount.textContent = allNotes.length
        ? `${allNotes.length} ${allNotes.length === 1 ? 'note' : 'notes'}` : '';
      renderNotes(allNotes);
    }
  }

  // ── Tag filter ────────────────────────────────────────────────────────────────
  function filterByTag(tag) {
    activeTag = tag;
    searchInput.value = '';
    searchClear.classList.add('hidden');
    notesLabel.textContent  = 'Saved';
    tagFilterText.textContent = tag;
    tagFilterChip.classList.remove('hidden');
    const filtered = allNotes.filter(n => n.tags?.includes(tag));
    notesCount.textContent = filtered.length
      ? `${filtered.length} ${filtered.length === 1 ? 'note' : 'notes'}` : '';
    renderNotes(filtered);
  }

  function clearTagFilter() {
    activeTag = null;
    tagFilterChip.classList.add('hidden');
    notesLabel.textContent = 'Saved';
    notesCount.textContent = allNotes.length
      ? `${allNotes.length} ${allNotes.length === 1 ? 'note' : 'notes'}` : '';
    renderNotes(allNotes);
  }

  // ── Event listeners ───────────────────────────────────────────────────────────
  authBtn.addEventListener('click', handleAuth);

  passInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
  });

  btnLogout.addEventListener('click', () => db.auth.signOut());

  btnSave.addEventListener('click', saveNote);

  noteInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveNote();
  });

  noteInput.addEventListener('input', () => {
    charCount.textContent = `${noteInput.value.length.toLocaleString()} / 10,000`;
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.classList.toggle('hidden', !q);
    clearTimeout(searchTimer);
    if (!q) { clearSearch(); return; }
    searchTimer = setTimeout(() => searchNotes(q), 500);
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') clearSearch();
  });

  // ── Auth state ────────────────────────────────────────────────────────────────
  db.auth.onAuthStateChange((_event, session) => {
    if (session) showApp(session); else showAuth();
  });

  db.auth.getSession().then(({ data: { session } }) => {
    if (session) showApp(session); else showAuth();
  });
</script>
</body>
</html>
